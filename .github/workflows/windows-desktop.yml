name: Windows desktop build

# Build-only check for the Tauri shell: push the `ci` branch to run it.
# Nothing else is built, no tests run, and the result replaces the `ci-latest` release.
on:
  push:
    branches: [ci]

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_TAG: ci-latest

jobs:
  build:
    name: Build Windows x86-64 desktop package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds the portable payload, the release shell, and the NSIS installer.
      # The payload ships inside the installer, so the installer is the whole product.
      - name: Build desktop package
        run: bun run desktop:build

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' |
            Select-Object -First 1
          if (-not $installer) { throw 'Tauri did not produce an NSIS installer' }
          Write-Host "Installer: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 1)) MiB)"
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.installer.outputs.path }}
          archive: false
          if-no-files-found: error

      # The release is replaced on every run: the previous release and its tag are
      # deleted first, so `ci-latest` always points at the newest `ci` build.
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALLER: ${{ steps.installer.outputs.path }}
        run: |
          $tag = $env:RELEASE_TAG
          gh release delete $tag --yes --cleanup-tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "No previous release for tag $tag" }
          gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" 2>$null | Out-Null

          $version = (Get-Content 'build/desktop/payload.json' -Raw | ConvertFrom-Json).version
          $notes = @(
            'Automated Windows x64 desktop build from branch `ci`.'
            ''
            "- Commit: $env:GITHUB_SHA"
            "- Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            ''
            'The installer contains the payload, Node.js and the WebView2 runtime are not bundled.'
          ) -join "`n"
          gh release create $tag $env:INSTALLER --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Pie $version (Windows x64, CI)" `
            --notes $notes
