name: Windows desktop build

# Build-only check for the Tauri shell: push the `ci` branch to run it.
# Nothing else is built, and the project has no tests to run.
on:
  push:
    branches: [ci]

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x86-64 desktop package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds the portable payload, the release shell, and the NSIS installer.
      - name: Build desktop package
        run: bun run desktop:build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: pie-desktop-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            build/desktop/payload.json
          if-no-files-found: error
