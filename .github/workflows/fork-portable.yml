# fork: independent portable releases; never publishes to npm or bumps versions.
name: Fork portable packages

on:
  workflow_dispatch:
  push:
    tags: ["portable-*"]

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-glibc
            os: ubuntu-22.04
          - target: linux-arm64-glibc
            os: ubuntu-24.04-arm
          - target: win32-x64
            os: windows-2022
          - target: darwin-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - run: npm run package:portable
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.target }}
          path: build/portable/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/portable-')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: artifacts
          merge-multiple: true
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft \
            --title "$RELEASE_TAG" \
            --notes 'Portable packages: install the latest Node.js LTS, extract the matching archive, then run node bin/pi-web.js --no-open. See packaging/README.md for platform requirements and limitations.'
