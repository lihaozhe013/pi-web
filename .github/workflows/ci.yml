name: CI build

# Build-only CI: push the `ci` branch to build the Windows installer and the portable web
# archive, then replace the `ci-latest` release with both. Nothing else runs: no tests, no
# typecheck, no other platform.
on:
  push:
    branches: [ci]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE_TAG: ci-latest

jobs:
  desktop:
    name: Windows x86-64 desktop installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds the portable payload, the release shell, and the NSIS installer.
      # The payload ships inside the installer, so the installer is the whole product.
      - name: Build desktop package
        run: bun run desktop:build

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' |
            Select-Object -First 1
          if (-not $installer) { throw 'Tauri did not produce an NSIS installer' }
          Write-Host "Installer: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 1)) MiB)"
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.installer.outputs.path }}
          archive: false
          if-no-files-found: error

  web:
    name: Portable web archive (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The same pipeline that produces the desktop payload: built interface plus server
      # bundle, production dependencies only, source maps pruned. The archive carries no
      # Node.js runtime and needs no compilation step on the target machine.
      - name: Build portable archive
        run: bun run package:portable

      - name: Upload portable archive
        uses: actions/upload-artifact@v7
        with:
          name: pie-portable
          path: |
            build/portable/*.tar.gz
            build/portable/*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [desktop, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Collect artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*'
          merge-multiple: true
          path: dist

      - name: Show artifacts
        run: ls -l dist

      # The release is replaced on every run: the previous release and its tag are deleted
      # first, so `ci-latest` always points at the newest `ci` build.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          gh release delete "$tag" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" \
            || echo "No previous release for tag $tag"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1 || true

          version="$(node -p "require('./package.json').version")"
          notes=$(
            printf '%s\n' \
              'Automated build from branch ci: the Windows installer plus the portable web archive.' \
              '' \
              "- Commit: $GITHUB_SHA" \
              "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              '' \
              'The installer contains the payload itself and needs Windows x64, Node.js, and the WebView2 runtime.' \
              'The archive needs only Node.js 22.14 or newer and network access.'
          )

          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Pie $version (CI build)" \
            --notes "$notes"
