[package]
name = "pie-desktop"
version = "0.1.0"
description = "Desktop window for the Pie server"
edition = "2021"
rust-version = "1.77"
license = "MIT"
publish = false

[lib]
name = "pie_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
# Stripping proc-macro dylibs causes dyld mis-aligned LINKEDIT errors on macOS.
strip = false
